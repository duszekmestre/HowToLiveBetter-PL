# Rebuild all four formats whenever the book changes and upload them to the fixed
# "epub-latest" release. Download URLs remain unchanged:
#   EPUB        https://github.com/duszekmestre/HowToLiveBetter-PL/releases/download/epub-latest/HowToLiveBetter.epub
#   PDF         https://github.com/duszekmestre/HowToLiveBetter-PL/releases/download/epub-latest/HowToLiveBetter.pdf
#   Offline HTML https://github.com/duszekmestre/HowToLiveBetter-PL/releases/download/epub-latest/HowToLiveBetter.html
#   Anki deck   https://github.com/duszekmestre/HowToLiveBetter-PL/releases/download/epub-latest/HowToLiveBetter.apkg
# Pull requests build and validate the files but do not publish them. Artifacts are available on the Actions page.
name: Book formats

on:
  push:
    branches: [main]
    paths:
      - README.md
      - index.html
      - og.png
      - ads/**
      - book/**
      - docs/*.md
      - tools/**
      - .github/workflows/book.yml
  pull_request:
    paths:
      - README.md
      - index.html
      - og.png
      - ads/**
      - book/**
      - docs/*.md
      - tools/**
      - .github/workflows/book.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: book-${{ github.ref }}
  cancel-in-progress: true

env:
  PANDOC_VERSION: '3.11'
  TYPST_VERSION: '0.15.1'

jobs:
  # Check cross-references in a separate job, not as part of the build. A missing
  # anchor should not block publishing EPUB, PDF, or offline HTML.
  # This check must run in CI because the local sync-stats.mjs workflow is manual
  # and is unavailable to external pull requests. It has no dependencies and takes seconds.
  refs:
    name: Cross-reference check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/check-refs.mjs --check

  # Check plain-language text for length, research jargon, and abstract phrasing.
  # Keep this in a separate job so it does not block publishing.
  plain:
    name: Plain-language check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/check-plain.mjs

  # Check that the rules for splitting long benefits, notes, and sources match.
  # tools/lib/split-items.mjs serves EPUB and PDF; <split-rules> in index.html serves
  # the website and offline edition. Keep this separate so it does not block publishing.
  split:
    name: Split-rules consistency check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/check-split.mjs

  # Check that counts in README, index.html, and og.html match book/.
  # Local sync-stats.mjs must be run manually, and web-merged pull requests bypass it.
  # This job only checks: CI must not push commits to main, and Ubuntu lacks Microsoft YaHei
  # so it cannot regenerate og.png correctly.
  stats:
    name: Statistics check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # updates.mjs reads the Git history
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/sync-stats.mjs --check
      - run: node tools/updates.mjs --check

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/epub/package-lock.json

      - run: npm ci
        working-directory: tools/epub

      - name: EPUB
        run: node tools/epub/build.mjs

      - name: Offline HTML
        run: node tools/offline/build.mjs

      - name: Anki deck
        run: node tools/anki/build.mjs

      - name: Install pandoc, typst, and CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          curl -sSL "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-linux-amd64.tar.gz" | tar xz
          curl -sSL "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz" | tar xJ
          echo "$PWD/pandoc-${PANDOC_VERSION}/bin" >> "$GITHUB_PATH"
          echo "$PWD/typst-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"

      - name: PDF
        run: |
          typst fonts | grep -i -E 'noto (serif|sans) cjk' || echo 'Noto CJK not found; the PDF will use a fallback font. Check the fonts-noto-cjk installation step.'
          node tools/pdf/build.mjs

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: epubcheck
        run: |
          curl -sSL -o epubcheck.zip https://github.com/w3c/epubcheck/releases/download/v5.4.0/epubcheck-5.4.0.zip
          unzip -q epubcheck.zip
          java -jar epubcheck-5.4.0/epubcheck.jar dist/HowToLiveBetter.epub

      - uses: actions/upload-artifact@v4
        with:
          name: HowToLiveBetter
          path: |
            dist/HowToLiveBetter.epub
            dist/HowToLiveBetter.pdf
            dist/HowToLiveBetter.html
            dist/HowToLiveBetter.apkg

      - name: Publish to epub-latest release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f epub-latest
          git push -f origin epub-latest
          notes="Book commit ${GITHUB_SHA::7}, generated at $(date -u -d '+8 hours' +'%Y-%m-%d %H:%M') (China Standard Time). EPUB, PDF, offline HTML, and Anki deck are automatically rebuilt whenever the book changes. Download URLs remain unchanged."
          if gh release view epub-latest >/dev/null 2>&1; then
            gh release edit epub-latest --title "Book formats (EPUB / PDF / Offline HTML / Anki, auto-updated)" --notes "$notes"
          else
            gh release create epub-latest --title "Book formats (EPUB / PDF / Offline HTML / Anki, auto-updated)" --notes "$notes" --latest=false
          fi
          gh release upload epub-latest \
            dist/HowToLiveBetter.epub \
            dist/HowToLiveBetter.pdf \
            dist/HowToLiveBetter.html \
            dist/HowToLiveBetter.apkg --clobber
