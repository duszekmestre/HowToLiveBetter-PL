# Check external links in the book every Monday and add the results to the run summary.
# This workflow only reports results and never fails (the script always exits with code 0),
# so the run will always be green. Open its summary to see the report.
# Fix only confirmed failures (404, 410, or a DOI not found by doi.org).
# Connection failures are often caused by gov.cn blocking overseas runners; investigate
# only if they persist across several weekly runs.
# Older government sites may use TLS settings unsupported by Node even though they work
# in browsers; these do not need fixing.
# This workflow is separate from book.yml because link availability is unrelated to book
# changes, and checking hundreds of external sites on every push would be slow and noisy.
name: External link check

on:
  schedule:
    - cron: '0 1 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    name: External link check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/check-links.mjs
